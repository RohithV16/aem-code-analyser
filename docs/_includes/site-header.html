<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" href="{{ site.baseurl }}/">
      <span class="brand__mark" aria-hidden="true">AEM</span>
      <span>AEM Code Analyser</span>
      <span class="brand__version">v{{ site.data.version.current }}</span>
    </a>

    <nav class="site-nav" id="siteNav" aria-label="Main">
      <a href="{{ site.baseurl }}/" {% if page.nav == 'overview' %}aria-current="page"{% endif %}>Overview</a>
      <a href="{{ site.baseurl }}/getting-started/" {% if page.nav == 'start' %}aria-current="page"{% endif %}>Getting started</a>
      <a href="{{ site.baseurl }}/issues/" {% if page.nav == 'issues' %}aria-current="page"{% endif %}>Issues</a>
      <a href="{{ site.baseurl }}/reference/" {% if page.nav == 'reference' %}aria-current="page"{% endif %}>Reference</a>
      <a href="https://github.com/RohithV16/aem-code-analyser" rel="noopener">GitHub</a>
    </nav>

    <div class="header-tools">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="8" cy="8" r="3.1"/>
          <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M12.95 3.05l-1.13 1.13M4.18 11.82l-1.13 1.13" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="siteNav">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>
