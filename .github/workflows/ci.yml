name: Build, verify, release

# One pipeline for the repository: verification on every push and pull request, and a
# release when someone dispatches it with a version bump. Maven Central publishing is
# deliberately NOT here: it has a quota and an irreversible public record, so it stays a
# separate manual workflow in publish-central.yml.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release: version bump (runs the tests, then tags and publishes the release)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: "Release: overwrite the tag if it already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A push may cancel an in-flight verification run, but never a release halfway through.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn -B -ntp clean verify

  integration:
    name: Maven Invoker ITs
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install this build into the local repository
        run: mvn -B -ntp -DskipTests install

      - name: Run Invoker ITs
        run: mvn -B -ntp -Prun-its -pl aem-analyser-maven-plugin verify

  validation:
    name: Rule docs, probes and reactor
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build the CLI
        run: mvn -B -ntp -DskipTests package

      - name: Rule documentation is current
        run: scripts/check-rule-docs.sh

      - name: Every rule fires on its probe
        run: scripts/run-rule-probes.sh

      - name: Validation reactor produces exactly the expected findings
        run: scripts/run-reactor-validation.sh

      - name: Published demo is stamped with the released version
        run: scripts/build-demo-report.sh --check

  quality:
    name: Quality report
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle / formatting report
        run: mvn -B -ntp -Pquality verify

  site:
    name: Build site
    # The site is data + generated docs, so it is built here rather than by Pages' own
    # branch builder: one pipeline, and nothing is published that this run did not validate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: |
          gem install jekyll -v 4.4.1 --no-document
          gem install jekyll-sitemap -v 1.4.0 --no-document

      - name: Build the site
        run: jekyll build --source docs --destination _site --quiet

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Bump version in POMs
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          OLD_VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text.strip())
          ")
          NEW_VERSION=$(python3 scripts/next-version.py release "$OLD_VERSION" "$BUMP")
          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null && [ "${{ inputs.force }}" != "true" ]; then
            echo "tag v${NEW_VERSION} already exists; re-run with force=true to overwrite it" >&2
            exit 1
          fi
          LAST_RELEASED=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)
          mvn versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
          echo "previous=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lastReleased=${LAST_RELEASED}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Point the published site at the new release
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          mkdir -p docs/_data
          printf 'current: %s\n' "$VERSION" > docs/_data/version.yml
          cat docs/_data/version.yml

      - name: Build and package
        run: mvn clean package --batch-mode

      # The demo is proof of the product, so it is rebuilt from the jar this release just built and
      # committed below: it can never name a version that was not published.
      - name: Regenerate the published demo from the released jar
        run: scripts/build-demo-report.sh aem-analyser-cli/target/aem-analyser-cli.jar

      - name: Generate Checksums
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          mkdir -p target/release-assets
          cp "aem-analyser-cli/target/aem-analyser-cli.jar" target/release-assets/
          # The stable name keeps the `/releases/latest/download/aem-analyser-cli.jar` link
          # working; the versioned name lets a download be pinned (install.sh prefers it).
          cp "aem-analyser-cli/target/aem-analyser-cli.jar" "target/release-assets/aem-analyser-cli-${VERSION}.jar"
          cp "aem-analyser-core/target/aem-analyser-core-${VERSION}.jar" target/release-assets/
          cp "aem-analyser-maven-plugin/target/aem-analyser-maven-plugin-${VERSION}.jar" target/release-assets/
          cp "pom.xml" "target/release-assets/aem-code-analyser-${VERSION}.pom"
          cp "aem-analyser-core/pom.xml" "target/release-assets/aem-analyser-core-${VERSION}.pom"
          cp "aem-analyser-maven-plugin/pom.xml" "target/release-assets/aem-analyser-maven-plugin-${VERSION}.pom"
          cd target/release-assets
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Commit version bump and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            git tag -f "${{ steps.bump.outputs.tag }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin "refs/tags/${{ steps.bump.outputs.tag }}" --force
          else
            git tag "${{ steps.bump.outputs.tag }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin "refs/tags/${{ steps.bump.outputs.tag }}"
          fi

      # Maven Central is deliberately NOT part of a release: a release only tags,
      # publishes to GitHub Packages and attaches the assets. Central has a publishing
      # quota and an irreversible public record, so it is a separate manual workflow:
      # .github/workflows/publish-central.yml

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: AEM Code Analyser ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            target/release-assets/aem-analyser-cli.jar
            target/release-assets/aem-analyser-cli-*.jar
            target/release-assets/aem-analyser-maven-plugin-*.jar
            target/release-assets/aem-analyser-core-*.jar
            target/release-assets/*.pom
            target/release-assets/SHA256SUMS.txt
          body: |
            ### AEM Code Analyser ${{ steps.bump.outputs.tag }}

            Cross-boundary dead code, duplication and AEM as a Cloud Service analysis for Adobe Experience Manager projects.

            #### 📦 CLI Standalone Binary
            Download `aem-analyser-cli.jar` attached below and run:
            ```bash
            java -jar aem-analyser-cli.jar --project-root /path/to/aem-project
            ```

            Verify integrity:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            Or let the installer verify it and put an `aem-analyser` command on your PATH:

            ```bash
            curl -fsSLO https://raw.githubusercontent.com/RohithV16/aem-code-analyser/main/install.sh
            sh install.sh --version ${{ steps.bump.outputs.version }}
            aem-analyser .
            ```

            #### 🧰 Install the plugin without any registry access
            The Maven plugin cannot be consumed from JitPack: JitPack relocates the groupId, and Maven
            rejects a plugin whose descriptor declares a different group. Attached here are the plugin,
            the core library and their POMs, so an air-gapped or offline install is three commands
            (also works when you just do not want to configure a token):

            ```bash
            mvn install:install-file -Dfile=aem-code-analyser-${{ steps.bump.outputs.version }}.pom \
                -DpomFile=aem-code-analyser-${{ steps.bump.outputs.version }}.pom
            mvn install:install-file -Dfile=aem-analyser-core-${{ steps.bump.outputs.version }}.jar \
                -DpomFile=aem-analyser-core-${{ steps.bump.outputs.version }}.pom
            mvn install:install-file -Dfile=aem-analyser-maven-plugin-${{ steps.bump.outputs.version }}.jar \
                -DpomFile=aem-analyser-maven-plugin-${{ steps.bump.outputs.version }}.pom
            ```

            Then run it in any project, with no further downloads:

            ```bash
            mvn io.github.rohithv16:aem-analyser-maven-plugin:${{ steps.bump.outputs.version }}:check
            ```

            #### 📚 Library from JitPack (no token required)
            `aem-analyser-core` has no plugin descriptor, so JitPack serves it fine:

            ```xml
            <repositories>
                <repository>
                    <id>jitpack.io</id>
                    <url>https://jitpack.io</url>
                </repository>
            </repositories>
            ```

            ```xml
            <dependency>
                <groupId>com.github.RohithV16.aem-code-analyser</groupId>
                <artifactId>aem-analyser-core</artifactId>
                <version>${{ steps.bump.outputs.tag }}</version>
            </dependency>
            ```

            #### 🧩 Maven Plugin via GitHub Packages
            GitHub's Maven registry requires authentication even for public packages, so this route needs a
            PAT with `read:packages` in your `settings.xml` (`<server><id>github</id>...`).

            ```xml
            <pluginRepositories>
                <pluginRepository>
                    <id>github</id>
                    <name>GitHub Packages</name>
                    <url>https://maven.pkg.github.com/RohithV16/aem-code-analyser</url>
                </pluginRepository>
            </pluginRepositories>
            ```

            ```xml
            <plugin>
                <groupId>io.github.rohithv16</groupId>
                <artifactId>aem-analyser-maven-plugin</artifactId>
                <version>${{ steps.bump.outputs.version }}</version>
                <executions>
                    <execution>
                        <phase>verify</phase>
                        <goals>
                            <goal>check</goal>
                        </goals>
                    </execution>
                </executions>
            </plugin>
            ```

      - name: Leave main on the next development version
        shell: bash
        env:
          RELEASED: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT=$(python3 scripts/next-version.py snapshot "$RELEASED")
          mvn versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git add -A
          git commit -m "chore: begin ${NEXT} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "main is now on ${NEXT} (published ${RELEASED})"
