name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn -B -ntp clean verify

  integration:
    name: Maven Invoker ITs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install this build into the local repository
        run: mvn -B -ntp -DskipTests install

      - name: Run Invoker ITs
        run: mvn -B -ntp -Prun-its -pl aem-analyser-maven-plugin verify

  validation:
    name: Rule docs, probes and reactor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build the CLI
        run: mvn -B -ntp -DskipTests package

      - name: Rule documentation is current
        run: scripts/check-rule-docs.sh

      - name: Every rule fires on its probe
        run: scripts/run-rule-probes.sh

      - name: Validation reactor produces exactly the expected findings
        run: scripts/run-reactor-validation.sh

  quality:
    name: Quality report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle / formatting report
        run: mvn -B -ntp -Pquality verify
