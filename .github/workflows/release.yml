name: Release AEM Code Analyser

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: "Overwrite the tag if it already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Bump version in POMs
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          OLD_VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text.strip())
          ")
          NEW_VERSION=$(python3 scripts/next-version.py release "$OLD_VERSION" "$BUMP")
          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null && [ "${{ inputs.force }}" != "true" ]; then
            echo "tag v${NEW_VERSION} already exists; re-run with force=true to overwrite it" >&2
            exit 1
          fi
          LAST_RELEASED=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)
          mvn versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
          echo "previous=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lastReleased=${LAST_RELEASED}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: mvn clean package --batch-mode

      - name: Generate Checksums
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          mkdir -p target/release-assets
          cp "aem-analyser-cli/target/aem-analyser-cli.jar" target/release-assets/
          cp "aem-analyser-core/target/aem-analyser-core-${VERSION}.jar" target/release-assets/
          cp "aem-analyser-maven-plugin/target/aem-analyser-maven-plugin-${VERSION}.jar" target/release-assets/
          cp "pom.xml" "target/release-assets/aem-code-analyser-${VERSION}.pom"
          cp "aem-analyser-core/pom.xml" "target/release-assets/aem-analyser-core-${VERSION}.pom"
          cp "aem-analyser-maven-plugin/pom.xml" "target/release-assets/aem-analyser-maven-plugin-${VERSION}.pom"
          cd target/release-assets
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Commit version bump and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          if [ "${{ inputs.force }}" = "true" ]; then
            git tag -f "${{ steps.bump.outputs.tag }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin "refs/tags/${{ steps.bump.outputs.tag }}" --force
          else
            git tag "${{ steps.bump.outputs.tag }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin "refs/tags/${{ steps.bump.outputs.tag }}"
          fi

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: AEM Code Analyser ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            target/release-assets/aem-analyser-cli.jar
            target/release-assets/aem-analyser-maven-plugin-*.jar
            target/release-assets/aem-analyser-core-*.jar
            target/release-assets/*.pom
            target/release-assets/SHA256SUMS.txt
          body: |
            ### AEM Code Analyser ${{ steps.bump.outputs.tag }}

            Dead code detection engine for Adobe Experience Manager (Phase 1: Java & OSGi Configurations).

            #### 📦 CLI Standalone Binary
            Download `aem-analyser-cli.jar` attached below and run:
            ```bash
            java -jar aem-analyser-cli.jar --project-root /path/to/aem-project
            ```

            Verify integrity:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            #### 🧰 Install the plugin without any registry access
            The Maven plugin cannot be consumed from JitPack: JitPack relocates the groupId, and Maven
            rejects a plugin whose descriptor declares a different group. Attached here are the plugin,
            the core library and their POMs, so an air-gapped or offline install is three commands
            (also works when you just do not want to configure a token):

            ```bash
            mvn install:install-file -Dfile=aem-code-analyser-${{ steps.bump.outputs.version }}.pom \
                -DpomFile=aem-code-analyser-${{ steps.bump.outputs.version }}.pom
            mvn install:install-file -Dfile=aem-analyser-core-${{ steps.bump.outputs.version }}.jar \
                -DpomFile=aem-analyser-core-${{ steps.bump.outputs.version }}.pom
            mvn install:install-file -Dfile=aem-analyser-maven-plugin-${{ steps.bump.outputs.version }}.jar \
                -DpomFile=aem-analyser-maven-plugin-${{ steps.bump.outputs.version }}.pom
            ```

            Then run it in any project, with no further downloads:

            ```bash
            mvn io.github.rohithv16:aem-analyser-maven-plugin:${{ steps.bump.outputs.version }}:check
            ```

            #### 📚 Library from JitPack (no token required)
            `aem-analyser-core` has no plugin descriptor, so JitPack serves it fine:

            ```xml
            <repositories>
                <repository>
                    <id>jitpack.io</id>
                    <url>https://jitpack.io</url>
                </repository>
            </repositories>
            ```

            ```xml
            <dependency>
                <groupId>com.github.RohithV16.aem-code-analyser</groupId>
                <artifactId>aem-analyser-core</artifactId>
                <version>${{ steps.bump.outputs.tag }}</version>
            </dependency>
            ```

            #### 🧩 Maven Plugin via GitHub Packages
            GitHub's Maven registry requires authentication even for public packages, so this route needs a
            PAT with `read:packages` in your `settings.xml` (`<server><id>github</id>...`).

            ```xml
            <pluginRepositories>
                <pluginRepository>
                    <id>github</id>
                    <name>GitHub Packages</name>
                    <url>https://maven.pkg.github.com/RohithV16/aem-code-analyser</url>
                </pluginRepository>
            </pluginRepositories>
            ```

            ```xml
            <plugin>
                <groupId>io.github.rohithv16</groupId>
                <artifactId>aem-analyser-maven-plugin</artifactId>
                <version>${{ steps.bump.outputs.version }}</version>
                <executions>
                    <execution>
                        <phase>verify</phase>
                        <goals>
                            <goal>check</goal>
                        </goals>
                    </execution>
                </executions>
            </plugin>
            ```

      - name: Leave main on the next development version
        shell: bash
        env:
          RELEASED: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT=$(python3 scripts/next-version.py snapshot "$RELEASED")
          mvn versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git add -A
          git commit -m "chore: begin ${NEXT} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "main is now on ${NEXT} (published ${RELEASED})"
