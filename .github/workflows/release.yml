name: Release AEM Code Analyser

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: "Overwrite the tag if it already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Bump version in POMs
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          OLD_VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text.strip())
          ")
          NEW_VERSION=$(python3 scripts/next-version.py release "$OLD_VERSION" "$BUMP")
          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null && [ "${{ inputs.force }}" != "true" ]; then
            echo "tag v${NEW_VERSION} already exists; re-run with force=true to overwrite it" >&2
            exit 1
          fi
          LAST_RELEASED=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)
          mvn versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
          echo "previous=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lastReleased=${LAST_RELEASED}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: mvn clean package --batch-mode

      - name: Generate Checksums
        shell: bash
        run: |
          cd aem-analyser-cli/target
          sha256sum aem-analyser-cli.jar > SHA256SUMS.txt

      - name: Sync documented versions
        shell: bash
        env:
          # The snippets advertise the newest published release, which is the newest tag - not the
          # development version the POM carried into this run.
          OLD_VERSION: ${{ steps.bump.outputs.lastReleased }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          old = os.environ["OLD_VERSION"].removesuffix("-SNAPSHOT")
          new = os.environ["NEW_VERSION"]
          if not old:
              # No tag to anchor on (first release): leave the snippets untouched rather than
              # matching an empty pattern.
              print("no previous release tag found; skipping documented-version sync")
              raise SystemExit(0)
          targets = ["README.md", "docs/index.md", "docs/MAVEN_CENTRAL_PUBLISHING_GUIDE.md"]
          pattern = re.compile(r"(?<![\d.])" + re.escape(old) + r"(?:-SNAPSHOT)?(?![\d.])")
          for name in targets:
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              updated, count = pattern.subn(new, text)
              if count:
                  path.write_text(updated)
                  print(f"{name}: {count} version reference(s) -> {new}")
          PY

      - name: Commit version bump and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          if [ "${{ inputs.force }}" = "true" ]; then
            git tag -f "${{ steps.bump.outputs.tag }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin "refs/tags/${{ steps.bump.outputs.tag }}" --force
          else
            git tag "${{ steps.bump.outputs.tag }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin "refs/tags/${{ steps.bump.outputs.tag }}"
          fi

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: AEM Code Analyser ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            aem-analyser-cli/target/aem-analyser-cli.jar
            aem-analyser-cli/target/SHA256SUMS.txt
          body: |
            ### AEM Code Analyser ${{ steps.bump.outputs.tag }}

            Dead code detection engine for Adobe Experience Manager (Phase 1: Java & OSGi Configurations).

            #### 📦 CLI Standalone Binary
            Download `aem-analyser-cli.jar` attached below and run:
            ```bash
            java -jar aem-analyser-cli.jar --project-root /path/to/aem-project
            ```

            Verify integrity:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            #### 🧩 Maven Plugin Integration
            Add the GitHub Packages plugin repository and plugin definition to your project's `pom.xml`:

            ```xml
            <pluginRepositories>
                <pluginRepository>
                    <id>github</id>
                    <name>GitHub Packages</name>
                    <url>https://maven.pkg.github.com/RohithV16/aem-code-analyser</url>
                </pluginRepository>
            </pluginRepositories>
            ```

            ```xml
            <plugin>
                <groupId>io.github.rohithv16</groupId>
                <artifactId>aem-analyser-maven-plugin</artifactId>
                <version>${{ steps.bump.outputs.version }}</version>
                <executions>
                    <execution>
                        <phase>verify</phase>
                        <goals>
                            <goal>check</goal>
                        </goals>
                    </execution>
                </executions>
            </plugin>
            ```

      - name: Leave main on the next development version
        shell: bash
        env:
          RELEASED: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT=$(python3 scripts/next-version.py snapshot "$RELEASED")
          mvn versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git add -A
          git commit -m "chore: begin ${NEXT} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "main is now on ${NEXT} (published ${RELEASED})"
