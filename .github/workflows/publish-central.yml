name: Publish to Maven Central

# Manual on purpose. A release (.github/workflows/release.yml) only tags, publishes to GitHub
# Packages and attaches the assets; Central has a publishing quota and a permanent public record,
# so uploading there is a deliberate, human-triggered action.
#
# The upload is validated by the Portal and then waits for a second, human click on
# https://central.sonatype.com/publishing/deployments - autoPublish is off in the pom.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.10) - must already exist"
        required: true
      dry_run:
        description: "Build and sign only; do not upload"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Refuse to publish a snapshot
        run: |
          VERSION=$(python3 -c "
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text.strip())
          ")
          echo "version at ${{ inputs.tag }}: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "::error::${{ inputs.tag }} is a snapshot; Central only accepts releases"; exit 1 ;;
          esac

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | grep '^sec' | awk -F: '{print "key " $5 " expires " ($7 == "" ? "never" : $7)}'

      - name: Build and sign (dry run)
        if: ${{ inputs.dry_run }}
        run: mvn -B -ntp -Prelease-central verify -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE"

      - name: Upload to the Sonatype Portal
        if: ${{ !inputs.dry_run }}
        run: |
          mvn -B -ntp -Prelease-central deploy -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE"
          echo "::notice::Deployment validated and waiting for the manual release at https://central.sonatype.com/publishing/deployments"
